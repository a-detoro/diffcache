[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachezero"
version = "0.1.0"
description = "Precompute+cache frozen encoders, quantize the trainable DiT via QLoRA, and reclaim the freed GPU for ZeRO-2/DDP data parallelism -- a reusable framework for the JSC paper's methodology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antonio De Toro Castro" }]
dependencies = [
    "torch>=2.1",
    "torchvision",
    "diffusers>=0.37",
    "transformers>=4.51",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "pillow",
]

[project.optional-dependencies]
zero2 = ["deepspeed>=0.14.5"]
dev = ["pytest"]

[project.scripts]
cachezero = "cachezero.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cachezero"]
